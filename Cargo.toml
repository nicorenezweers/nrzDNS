[package]
name = "nrzdns"
version = "1.1.0"
edition = "2021"
description = "nrzDNS – selbst gehosteter DNS-Server wie Technitium, in Rust (Rocket, SQLite, Dioxus)"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
publish = false

# Server, Engine und Typen sind ein Workspace; die Oberfläche (ui/) ist ein eigenes Projekt
# (WebAssembly) und wird mit scripts/ui.sh gebaut.
[workspace]
members = [".", "engine", "types"]
exclude = ["ui"]

[dependencies]
# Gemeinsame Typen der JSON-API (auch von Engine und Oberfläche benutzt)
nrzdns-types = { path = "types" }
# Der DNS-Server selbst (UDP/TCP, Zonen, Weiterleitung, Cache, Sperrlisten)
nrzdns-engine = { path = "engine" }

# Web
rocket = { version = "=0.5.1", features = ["secrets", "json"] }
# Rocket 0.5.1 verlangt nur "^0.5.1" für diese beiden – ohne feste Version zieht
# Cargo 0.5.2 (hyper 1.x), und Rocket 0.5.1 lässt sich nicht mehr übersetzen.
rocket_http = "=0.5.1"
rocket_codegen = "=0.5.1"

# Datenbank: eine SQLite-Datei (Konten, Einstellungen, Zonen, Listen, Abfrageprotokoll)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }

# Laufzeit & Hilfen
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"

# Sicherheit
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Argon2 ist ohne Optimierung rund 50-mal langsamer – sonst dauert jede Anmeldung in Tests
# und mit `cargo run` über eine Sekunde.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
