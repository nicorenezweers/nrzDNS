name: CI

# Private repository = paid Actions minutes: only pushes to main and pull requests, nothing for
# documentation-only changes, one run per branch (older runs are cancelled), caches saved on
# main only.
on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "static/*.svg"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "static/*.svg"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server, engine, types (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      # Without ui/dist/public the server builds with an empty UI list and shows a notice
      # instead of the interface; clippy and the API tests don't need it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  ui:
    name: Web UI (fmt, wasm32 check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ui
          workspaces: ui -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        working-directory: ui
        run: cargo fmt --check

      # assets/tailwind.css is generated by `dx` (and git-ignored), but `asset!` needs the file
      # to exist at compile time; an empty one is enough for type checking. ui/ is its own
      # project; --locked as soon as its Cargo.lock is committed.
      - name: Check
        working-directory: ui
        run: |
          test -f assets/tailwind.css || touch assets/tailwind.css
          locked=""; test -f Cargo.lock && locked="--locked"
          cargo check $locked --target wasm32-unknown-unknown
