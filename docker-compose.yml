# Beispiel: docker compose up -d → Oberfläche auf http://localhost:8380, DNS auf Port 53.
# Das erste Konto, das du anlegst, wird Administrator.
# Port 53 muss auf dem Rechner frei sein (kein Pi-hole, AdGuard Home, dnsmasq oder
# systemd-resolved mit DNSStubListener auf 0.0.0.0:53).
services:
  nrzdns:
    image: ghcr.io/nicorenezweers/nrz-dns:1.0.0
    # Selbst bauen statt das fertige Image zu holen:
    # build: .
    container_name: nrzdns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8380:8380"
    environment:
      TZ: Europe/Zurich
      # Hinter HTTPS (Reverse Proxy) einschalten:
      NRZDNS_COOKIE_SECURE: "false"
      # DNS-Adressen im Container, durch Kommas getrennt:
      # NRZDNS_DNS_LISTEN: "0.0.0.0:53,[::]:53"
    volumes:
      # nrzdns.db: Konten, Einstellungen, Zonen, Sperrlisten, Abfrageprotokoll – alles in einer Datei
      - nrzdns-data:/data
    # Das Image läuft als Benutzer 1000. Port 53 darf er dank dieser Einstellung öffnen
    # (Docker setzt sie seit 20.10 ohnehin), ganz ohne zusätzliche Rechte.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  nrzdns-data:
